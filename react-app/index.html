<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CV & Portfolio - Mysko Anastasiia, Frontend Developer" />
    <meta name="author" content="Mysko Anastasiia" />
    <title>Mysko Anastasiia - Frontend Developer CV</title>

    <!-- Підключення сучасного шрифту Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Базові глобальні стилі та підтримка темної теми для body і карток -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      body {
        background-color: #f8fafc;
        color: #1e293b;
        line-height: 1.6;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      body.dark-mode,
      body.dark {
        background-color: #0f172a;
        color: #f1f5f9;
      }

      body.dark-mode main section,
      body.dark main section {
        background-color: #1e293b !important;
        color: #f1f5f9 !important;
        border-color: #334155 !important;
      }

      body.dark-mode main section div,
      body.dark main section div {
        background-color: #0f172a !important;
        color: #e2e8f0 !important;
        border-color: #334155 !important;
      }

      body.dark-mode main section p,
      body.dark main section p {
        color: #cbd5e1 !important;
      }

      /* Плавний скролбар */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #64748b;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
  </head>
  <body>
    <!-- Кореневий контейнер для рендерингу React-компонентів -->
    <div id="root"></div>

    <!-- Точка входу React-застосунку -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
